name: CI

# Quality gate for pull requests. Pushes to main run the same checks inside
# deploy.yml, so they are not duplicated here.
on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test -- --ci

      - run: npm run lint
