name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages. Nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a run that has
# already applied migrations is always allowed to finish.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test -- --ci

      - run: npm run lint

  supabase:
    name: Migrations and edge function
    needs: quality
    runs-on: ubuntu-latest
    # Gate: add required reviewers to the "production" environment in repo
    # settings and this job waits for approval before touching the live
    # database. Without reviewers it runs straight through.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Print what is about to be applied before applying it, so the run log
      # records the change even when the migration turns out to be a mistake.
      - name: List pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy bgg edge function
        run: supabase functions deploy bgg --use-api --project-ref "$PROJECT_REF"
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build:
    name: Build web bundle
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # These are inlined into the JS bundle at build time. They are public by
      # design (row level security is what protects the data), but they must be
      # present here or the deployed app has no backend to talk to.
      - name: Export static site
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}

      # GitHub Pages serves 404.html for any path with no matching file. The
      # export is a single-page app, so serving index.html there is what makes
      # a cold visit to /join/<token> or /game/<id> boot the router instead of
      # showing GitHub's 404. Without this, invite links are broken.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # Redundant with the artifact-based deploy below, which does not run
      # Jekyll. Kept so the output stays correct if this ever moves to a
      # branch-based deploy, where Jekyll would strip the _expo directory.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Fail if the bundle looks unconfigured
        run: |
          if ! grep -qr "supabase.co" dist/_expo/static/js; then
            echo "Built bundle contains no Supabase URL - check the repository secrets." >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: [build, supabase]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
